<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Neuroloft</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 55px 24px 32px;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(
          ellipse at 50% 100%,
          rgba(65, 115, 165, 0.15) 0%,
          rgba(0, 0, 0, 0) 38%
        ),
        #000;
    }

    /* Neuroloft name */

    .brand {
      font-size: 22px;
      font-weight: 300;
      letter-spacing: 10px;
      color: #f5f5f5;
      z-index: 2;
    }

    /* Main message */

    .hero {
      max-width: 1000px;
      margin: auto 0;
      position: relative;
      z-index: 2;
      transform: translateY(-15px);
    }

    .statement {
      font-size: clamp(24px, 2.6vw, 38px);
      line-height: 1.45;
      font-weight: 300;
      color: #cfcfcf;
    }

    .intelligence {
      margin-top: 7px;
      font-size: clamp(38px, 4.2vw, 58px);
      line-height: 1.2;
      font-weight: 300;
      color: #cfcfcf;
    }

    .intelligence strong {
      color: #fff;
      font-weight: 700;
    }

    /* Supporting message */

    .description {
      margin: 46px auto 0;
      max-width: 900px;
      font-size: clamp(14px, 1.35vw, 18px);
      line-height: 1.9;
      letter-spacing: 1.4px;
      color: #aaa;
      font-weight: 300;
    }

    .description .first-line {
      color: #d0d0d0;
    }

    /* Subtle horizon */

    .horizon {
      position: absolute;
      width: 1200px;
      height: 330px;
      left: 50%;
      bottom: -225px;
      transform: translateX(-50%);
      border-radius: 50%;
      border-top: 1px solid rgba(180, 215, 255, 0.75);
      box-shadow:
        0 -3px 12px rgba(180, 220, 255, 0.20),
        0 -15px 55px rgba(90, 160, 220, 0.16);
      z-index: 1;
    }

    .horizon::after {
      content: "";
      position: absolute;
      width: 180px;
      height: 25px;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(220, 235, 255, 0.16);
      filter: blur(18px);
      border-radius: 50%;
    }

    /* Footer */

    .footer {
      position: relative;
      z-index: 2;
      font-size: 9px;
      letter-spacing: 4px;
      color: #666;
      margin-top: auto;
    }

    /* Mobile */

    @media (max-width: 600px) {
      .page {
        padding: 36px 20px 25px;
      }

      .brand {
        font-size: 16px;
        letter-spacing: 7px;
      }

      .hero {
        transform: translateY(-5px);
      }

      .statement {
        font-size: 22px;
        line-height: 1.5;
      }

      .intelligence {
        font-size: 36px;
      }

      .description {
        margin-top: 36px;
        font-size: 13px;
        line-height: 2;
        letter-spacing: 0.8px;
      }

      .horizon {
        width: 800px;
        height: 260px;
        bottom: -190px;
      }

      .footer {
        font-size: 7px;
        letter-spacing: 2.5px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="brand">
      NEUROLOFT
    </div>

    <section class="hero">

      <div class="statement">
        Everyone is building AI.<br>
        But AI is not the destination.
      </div>

      <div class="intelligence">
        <strong>Intelligence</strong> is.
      </div>

      <div class="description">
        <span class="first-line">
          We explore what comes next
        </span>
        <br>
        how intelligence will reshape technology, organizations, and life.
      </div>

    </section>

    <div class="horizon"></div>

    <div class="footer">
      IDEAS FOR A MORE INTELLIGENT TOMORROW
    </div>

  </main>

</body>
</html>
